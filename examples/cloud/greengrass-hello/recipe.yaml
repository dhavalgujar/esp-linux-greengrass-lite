RecipeFormatVersion: "2020-01-25"
ComponentName: "com.espressif.esp32s31.Hello"
ComponentVersion: "1.0.0"
ComponentDescription: >-
  ESP32-S31 demo: IPC configuration, local pub/sub and an AWS IoT Core round
  trip, then a periodic heartbeat to esp32s31/<thing>/heartbeat.
ComponentPublisher: "Espressif"
ComponentConfiguration:
  DefaultConfiguration:
    message: "Hello from ESP32-S31"
    heartbeatSeconds: 30
    accessControl:
      aws.greengrass.ipc.pubsub:
        com.espressif.esp32s31.Hello:pubsub:1:
          policyDescription: Local pub/sub self-test.
          operations:
            - "aws.greengrass#PublishToTopic"
            - "aws.greengrass#SubscribeToTopic"
          resources:
            - "esp32s31/hello"
      aws.greengrass.ipc.mqttproxy:
        com.espressif.esp32s31.Hello:mqttproxy:1:
          policyDescription: IoT Core round trip and heartbeat.
          operations:
            - "aws.greengrass#PublishToIoTCore"
            - "aws.greengrass#SubscribeToIoTCore"
          resources:
            - "esp32s31/*"
Manifests:
  - Platform:
      os: linux
      architecture: riscv32
      runtime: "*"
    # The binary ships in the image (package esp32s31-ggl-hello), so the
    # recipe needs no artifacts.
    # Lifecycle keys are case sensitive in nucleus lite: lowercase phases.
    Lifecycle:
      run:
        Script: "exec /usr/bin/esp32s31-ggl-hello {configuration:/heartbeatSeconds}"
